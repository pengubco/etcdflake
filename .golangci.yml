version: "2"

run:
  timeout: 5m

linters:
  enable:
    - copyloopvar
    - dupword
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - noctx
    - revive
    - unconvert
    - usetesting
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
