# Single-node etcd for the demo only. Its data lives in an emptyDir, so it is lost
# when the pod is deleted. Run a durable etcd cluster in production: i3d's
# uniqueness across restarts depends on the reservations stored in etcd.
apiVersion: v1
kind: Pod
metadata:
  name: etcd
  namespace: i3d
  labels:
    app.kubernetes.io/name: etcd
spec:
  containers:
    - name: etcd
      image: quay.io/coreos/etcd:v3.7.4
      command:
        - etcd
        - --name=etcd
        - --data-dir=/var/lib/etcd
        - --listen-client-urls=http://0.0.0.0:2379
        - --advertise-client-urls=http://etcd.i3d.svc:2379
      ports:
        - containerPort: 2379
          name: client
      volumeMounts:
        - name: data
          mountPath: /var/lib/etcd
  volumes:
    - name: data
      emptyDir: {}
---
# ClusterIP: reachable only from inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: i3d
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: etcd
  ports:
    - port: 2379
      targetPort: client
      name: client
