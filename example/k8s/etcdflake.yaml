apiVersion: v1
kind: ConfigMap
metadata:
  name: etcdflake-config
  namespace: etcdflake
data:
  config.json: |
    {
      "grpc_addr": "0.0.0.0:7669",
      "allow_insecure_grpc": true,
      "http_addr": "0.0.0.0:8001",
      "max_workers": 1024,
      "etcd": {
        "endpoints": ["etcd.etcdflake.svc:2379"],
        "prefix": "/etcdflake/",
        "username": "etcdflake"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcdflake
  namespace: etcdflake
spec:
  replicas: 5
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: etcdflake
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcdflake
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: etcdflake
          image: etcdflake:latest
          imagePullPolicy: IfNotPresent
          args: ["-config=/etc/etcdflake/config.json"]
          env:
            - name: ETCDFLAKE_ETCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: etcdflake-etcd
                  key: password
          ports:
            - containerPort: 7669
              name: grpc
            - containerPort: 8001
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/etcdflake
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: etcdflake-config
---
# ClusterIP: the gRPC API is reachable only from inside the cluster, and the
# metrics/health port isn't exposed through the Service at all. For clients
# outside the cluster, configure grpc_tls (with client_ca_file for mutual TLS)
# before exposing it.
apiVersion: v1
kind: Service
metadata:
  name: etcdflake
  namespace: etcdflake
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: etcdflake
  ports:
    - port: 7669
      targetPort: grpc
      name: grpc
